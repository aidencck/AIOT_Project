server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退：非静态资源一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台聚合 API 反向代理到网关（保留 /api 前缀，网关按 path 路由到 admin-console）
    # 变量 + resolver 延迟解析：nginx 启动不依赖上游 DNS 就绪，运行时动态解析，避免网关未就绪导致 CrashLoop
    location /api/ {
        resolver ${ADMIN_API_RESOLVER} valid=10s ipv6=off;
        set $api_upstream ${ADMIN_API_UPSTREAM};
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

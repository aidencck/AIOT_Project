# AIOT 平台共享默认配置；各服务通过 spring.config.import 引入，必要时在自身 application.yml 覆盖。
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: scheduling-
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 5000ms

aiot:
  openapi:
    public:
      enabled: ${AIOT_OPENAPI_PUBLIC_ENABLED:false}
  internal:
    token: ${AIOT_INTERNAL_TOKEN:}
  security:
    jwt:
      secret: ${AIOT_JWT_SECRET}
  device-service:
    base-url: ${AIOT_DEVICE_SERVICE_URL:lb://aiot-device-service}
  data-parser:
    base-url: ${AIOT_DATA_PARSER_BASE_URL:lb://aiot-data-parser}
  cross-service:
    http:
      timeout-ms: ${AIOT_CROSS_SERVICE_TIMEOUT_MS:2000}
      max-retries: ${AIOT_CROSS_SERVICE_MAX_RETRIES:1}
      retry-backoff-ms: ${AIOT_CROSS_SERVICE_RETRY_BACKOFF_MS:200}
      circuit-breaker-failure-threshold: ${AIOT_CROSS_SERVICE_CB_FAILURE_THRESHOLD:3}
      circuit-breaker-open-ms: ${AIOT_CROSS_SERVICE_CB_OPEN_MS:10000}
  events:
    device-status-stream: ${AIOT_EVENTS_DEVICE_STATUS_STREAM:aiot:stream:device-event}
    device-status-dlq-stream: ${AIOT_EVENTS_DEVICE_STATUS_DLQ_STREAM:aiot:stream:device-event:dlq}
    device-status-stream-consumer: ${spring.application.name}
    # Stream 保留治理：生产侧 addToStream 与消费侧 StreamRetentionTrimmer 共用的 MAXLEN 上限，
    # 使 XLEN 有界可观测，验收锚点 < 10000。
    stream-maxlen: ${AIOT_EVENTS_STREAM_MAXLEN:5000}
    stream-retention:
      enabled: ${AIOT_EVENTS_STREAM_RETENTION_ENABLED:true}
      fixed-delay-ms: ${AIOT_EVENTS_STREAM_RETENTION_FIXED_DELAY_MS:60000}
    consume-retry:
      max-attempts: ${AIOT_EVENTS_CONSUME_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${AIOT_EVENTS_CONSUME_RETRY_BACKOFF_MS:200}
    consume:
      consumer-count: ${AIOT_EVENTS_CONSUME_CONSUMER_COUNT:2}
      poll-timeout-ms: ${AIOT_EVENTS_CONSUME_POLL_TIMEOUT_MS:2000}
      batch-size: ${AIOT_EVENTS_CONSUME_BATCH_SIZE:16}
    pending-reclaim:
      enabled: ${AIOT_EVENTS_PENDING_RECLAIM_ENABLED:true}
      fixed-delay-ms: ${AIOT_EVENTS_PENDING_RECLAIM_FIXED_DELAY_MS:30000}
      max-batch-size: ${AIOT_EVENTS_PENDING_RECLAIM_MAX_BATCH_SIZE:64}
      min-idle-ms: ${AIOT_EVENTS_PENDING_RECLAIM_MIN_IDLE_MS:60000}
      max-delivery-count: ${AIOT_EVENTS_PENDING_RECLAIM_MAX_DELIVERY_COUNT:10}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:${aiot.openapi.public.enabled}}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:${aiot.openapi.public.enabled}}
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: WHEN_AUTHORIZED
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${AIOT_ENV:local}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 0.2
  otlp:
    tracing:
      endpoint: ${AIOT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

---
spring:
  config:
    activate:
      on-profile: dev,test

aiot:
  openapi:
    public:
      enabled: ${AIOT_OPENAPI_PUBLIC_ENABLED:true}

management:
  tracing:
    sampling:
      probability: 1.0

---
spring:
  config:
    activate:
      on-profile: staging

management:
  tracing:
    sampling:
      probability: 0.5

---
spring:
  config:
    activate:
      on-profile: prod

aiot:
  openapi:
    public:
      enabled: false

management:
  tracing:
    sampling:
      probability: 0.2

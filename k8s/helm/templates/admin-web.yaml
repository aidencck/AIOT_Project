{{/* 后台管理前端：静态站点，独立于 Java 服务矩阵（无 actuator / SERVER_PORT / JAVA_OPTS）。
     nginx unprivileged 固定 uid 101，故单独覆盖全局 runAsUser=1000，避免缓存/pid 目录权限异常。 */}}
{{- if .Values.services.adminWeb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
  namespace: {{ .Values.global.namespace }}
  labels:
    app: admin-web
    {{- include "aiot.standardLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.adminWeb.replicas }}
  selector: {matchLabels: {app: admin-web}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: admin-web
        {{- include "aiot.standardLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: admin-web
                topologyKey: kubernetes.io/hostname
      containers:
        - name: admin-web
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.adminWeb.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{containerPort: {{ .Values.services.adminWeb.port }}, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: ADMIN_API_UPSTREAM
              value: "gateway:8080"
            - name: ADMIN_API_RESOLVER
              value: "kube-dns.kube-system.svc.cluster.local"
          resources:
            requests: {{ toYaml .Values.services.adminWeb.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.services.adminWeb.resources.limits | nindent 14 }}
          readinessProbe:
            httpGet: {path: /, port: {{ .Values.services.adminWeb.port }}}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: {{ .Values.services.adminWeb.port }}}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin-web
  namespace: {{ .Values.global.namespace }}
  labels: {app: admin-web}
spec:
  type: ClusterIP
  ports: [{port: {{ .Values.services.adminWeb.port }}, targetPort: {{ .Values.services.adminWeb.port }}, protocol: TCP, name: http}]
  selector: {app: admin-web}
{{- end }}

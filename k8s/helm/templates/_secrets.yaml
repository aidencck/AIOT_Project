apiVersion: v1
kind: Secret
metadata:
  name: aiot-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.mysqlRootPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  EMQX_API_USER: {{ .Values.secrets.emqxApiUser | quote }}
  EMQX_API_PASSWORD: {{ .Values.secrets.emqxApiPassword | quote }}
  AIOT_JWT_SECRET: {{ .Values.secrets.aiotJwtSecret | quote }}
  AIOT_INTERNAL_TOKEN: {{ .Values.secrets.aiotInternalToken | quote }}
  AIOT_EMQX_WEBHOOK_SECRET: {{ .Values.secrets.aiotEmqxWebhookSecret | quote }}
  GRAFANA_ADMIN_USER: {{ .Values.secrets.grafanaAdminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}

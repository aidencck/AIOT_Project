{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: emqx
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: gateway, port: {number: 8080}}}
    {{- if .Values.services.adminWeb.enabled }}
    - host: {{ .Values.ingress.hosts.admin }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: admin-web, port: {number: {{ .Values.services.adminWeb.port }}}}}
    {{- end }}
    - host: {{ .Values.ingress.hosts.mqttWs }}
      http:
        paths:
          - path: /mqtt
            pathType: Prefix
            backend: {service: {name: emqx, port: {number: 8083}}}
    - host: {{ .Values.ingress.hosts.emqxDashboard }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: emqx, port: {number: 18083}}}
    {{- if .Values.observability.grafana.enabled }}
    - host: {{ .Values.ingress.hosts.grafana }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: grafana, port: {number: 3000}}}
    {{- end }}
    {{- if .Values.observability.prometheus.enabled }}
    - host: {{ .Values.ingress.hosts.prometheus }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: prometheus, port: {number: 9090}}}
    {{- end }}
{{- end }}

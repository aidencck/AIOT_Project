{{- if .Values.infra.mysql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mysql
    {{- include "aiot.standardLabels" . | nindent 4 }}
spec:
  serviceName: mysql
  replicas: {{ .Values.infra.mysql.replicas }}
  selector: {matchLabels: {app: mysql}}
  template:
    metadata:
      labels:
        app: mysql
        {{- include "aiot.standardLabels" . | nindent 4 }}
    spec:
      {{- include "aiot.podSecurityContext" . | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: mysql
      containers:
        - name: mysql
          image: {{ .Values.infra.mysql.image }}
          ports: [{containerPort: 3306, name: mysql}]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: aiot-secrets, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_DATABASE
              value: aiot_cloud
            - name: TZ
              valueFrom: {configMapKeyRef: {name: aiot-common-config, key: TZ}}
          volumeMounts:
            - {name: mysql-data, mountPath: /var/lib/mysql}
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests: {{ toYaml .Values.infra.mysql.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.infra.mysql.resources.limits | nindent 14 }}
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          {{- include "aiot.containerSecurityContext" . | nindent 10 }}
      volumes:
        - name: mysql-data
          persistentVolumeClaim: {claimName: mysql-data}
        - name: mysql-init
          configMap: {name: mysql-init-sql}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mysql
    {{- include "aiot.standardLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports: [{port: 3306, targetPort: 3306, protocol: TCP, name: mysql}]
  selector: {app: mysql}
{{- end }}

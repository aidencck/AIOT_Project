{{- if .Values.observability.prometheus.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [extensions]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Values.global.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels: {app: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports: [{containerPort: 9090, name: http}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {{ toYaml .Values.observability.prometheus.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.observability.prometheus.resources.limits | nindent 14 }}
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, initialDelaySeconds: 30, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9090}, initialDelaySeconds: 60, periodSeconds: 30}
      volumes:
        - name: config
          configMap: {name: prometheus-config, optional: true}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels: {app: prometheus}
spec:
  type: ClusterIP
  ports: [{port: 9090, targetPort: 9090, protocol: TCP, name: http}]
  selector: {app: prometheus}
{{- end }}

{{- if .Values.observability.alertmanager.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.global.namespace }}
  labels: {app: alertmanager}
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager}}
  template:
    metadata: {labels: {app: alertmanager}}
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.observability.alertmanager.image }}
          args: [--config.file=/etc/alertmanager/alertmanager.yml]
          ports: [{containerPort: 9093, name: http}]
          volumeMounts: [{name: config, mountPath: /etc/alertmanager, readOnly: true}]
          resources:
            requests: {{ toYaml .Values.observability.alertmanager.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.observability.alertmanager.resources.limits | nindent 14 }}
          readinessProbe: {httpGet: {path: /-/ready, port: 9093}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9093}, initialDelaySeconds: 30, periodSeconds: 20}
      volumes:
        - name: config
          configMap: {name: alertmanager-config, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.global.namespace }}
  labels: {app: alertmanager}
spec:
  type: ClusterIP
  ports: [{port: 9093, targetPort: 9093, protocol: TCP, name: http}]
  selector: {app: alertmanager}
{{- end }}

{{- if .Values.observability.loki.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: {{ .Values.global.namespace }}
  labels: {app: loki}
spec:
  serviceName: loki
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
        - name: loki
          image: {{ .Values.observability.loki.image }}
          args: [-config.file=/etc/loki/loki.yml]
          ports: [{containerPort: 3100, name: http}]
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /loki}
          resources:
            requests: {{ toYaml .Values.observability.loki.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.observability.loki.resources.limits | nindent 14 }}
          readinessProbe: {httpGet: {path: /ready, port: 3100}, initialDelaySeconds: 30, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /metrics, port: 3100}, initialDelaySeconds: 60, periodSeconds: 30}
      volumes:
        - name: config
          configMap: {name: loki-config, optional: true}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.global.namespace }}
  labels: {app: loki}
spec:
  type: ClusterIP
  ports: [{port: 3100, targetPort: 3100, protocol: TCP, name: http}]
  selector: {app: loki}
{{- end }}

{{- if .Values.observability.promtail.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ .Values.global.namespace }}
  labels: {app: promtail}
spec:
  selector: {matchLabels: {app: promtail}}
  template:
    metadata: {labels: {app: promtail}}
    spec:
      containers:
        - name: promtail
          image: {{ .Values.observability.promtail.image }}
          args: [-config.file=/etc/promtail/promtail.yml]
          volumeMounts:
            - {name: config, mountPath: /etc/promtail, readOnly: true}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: positions, mountPath: /positions}
          resources:
            requests: {{ toYaml .Values.observability.promtail.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.observability.promtail.resources.limits | nindent 14 }}
      volumes:
        - name: config
          configMap: {name: promtail-config, optional: true}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: positions
          persistentVolumeClaim: {claimName: promtail-positions}
{{- end }}

{{- if .Values.observability.tempo.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: {{ .Values.global.namespace }}
  labels: {app: tempo}
spec:
  serviceName: tempo
  replicas: 1
  selector: {matchLabels: {app: tempo}}
  template:
    metadata: {labels: {app: tempo}}
    spec:
      containers:
        - name: tempo
          image: {{ .Values.observability.tempo.image }}
          args: [-config.file=/etc/tempo/tempo.yml]
          ports:
            - {containerPort: 3200, name: tempo}
            - {containerPort: 4317, name: otlp-grpc}
            - {containerPort: 4318, name: otlp-http}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo, readOnly: true}
            - {name: data, mountPath: /var/tempo}
          resources:
            requests: {{ toYaml .Values.observability.tempo.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.observability.tempo.resources.limits | nindent 14 }}
          readinessProbe: {httpGet: {path: /ready, port: 3200}, initialDelaySeconds: 30, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /metrics, port: 3200}, initialDelaySeconds: 60, periodSeconds: 30}
      volumes:
        - name: config
          configMap: {name: tempo-config, optional: true}
        - name: data
          persistentVolumeClaim: {claimName: tempo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ .Values.global.namespace }}
  labels: {app: tempo}
spec:
  type: ClusterIP
  ports:
    - {port: 3200, targetPort: 3200, protocol: TCP, name: tempo}
    - {port: 4317, targetPort: 4317, protocol: TCP, name: otlp-grpc}
    - {port: 4318, targetPort: 4318, protocol: TCP, name: otlp-http}
  selector: {app: tempo}
{{- end }}

{{- if .Values.observability.grafana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels: {app: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          ports: [{containerPort: 3000, name: http}]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: aiot-secrets, key: GRAFANA_ADMIN_USER}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: aiot-secrets, key: GRAFANA_ADMIN_PASSWORD}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
          resources:
            requests: {{ toYaml .Values.observability.grafana.resources.requests | nindent 14 }}
            limits: {{ toYaml .Values.observability.grafana.resources.limits | nindent 14 }}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 30, periodSeconds: 15}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 60, periodSeconds: 30}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning, optional: true}
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels: {app: grafana}
spec:
  type: ClusterIP
  ports: [{port: 3000, targetPort: 3000, protocol: TCP, name: http}]
  selector: {app: grafana}
{{- end }}

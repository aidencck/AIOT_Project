<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIoT 后台管理系统</title>
  <link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>AIoT 后台管理系统</h1>
        <p class="page-subtitle">统一聚合家庭、设备、OTA、AI 治理与运营闭环，保持后台层低耦合。</p>
      </div>
      <div class="topbar-actions">
        <div class="home-switcher">
          <label for="homeSelector">当前家庭</label>
          <select id="homeSelector">
            <option value="">加载中...</option>
          </select>
          <button id="reloadWorkbenchBtn">切换工作台</button>
        </div>
        <div class="token-box">
        <input id="tokenInput" type="password" placeholder="粘贴 Bearer Token（不含 Bearer 前缀）" />
        <button id="saveTokenBtn">保存 Token</button>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="panel-header">
        <h2>闭环工作台</h2>
        <div class="filters">
          <span class="badge" id="closureScoreBadge">闭环评分 -</span>
          <span class="hint" id="selectedHomeHint"></span>
        </div>
      </div>
      <div class="grid workbench-summary" id="workbenchSummaryCards"></div>
      <div class="grid closure-grid" id="closureStageCards"></div>
      <div class="grid snapshot-grid" id="snapshotPanels"></div>
    </section>

    <section class="grid stats" id="statsCards"></section>

    <section class="panel">
      <div class="panel-header">
        <h2>AI 评估门禁</h2>
        <div class="filters">
          <input id="aiEvalScenes" placeholder="sceneType，多值逗号分隔，可选" />
          <button id="loadAiEvalBtn">刷新评估</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>场景</th>
            <th>报告存在</th>
            <th>门禁结果</th>
            <th>生成时间</th>
            <th>样本数</th>
            <th>Schema通过率</th>
          </tr>
        </thead>
        <tbody id="aiEvalTableBody"></tbody>
      </table>
      <p class="hint" id="aiEvalHint"></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>AI 业务活体验证</h2>
        <div class="filters">
          <button id="loadBusinessLiveFlowBtn">刷新验证</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>指标</th>
            <th>值</th>
          </tr>
        </thead>
        <tbody id="businessLiveFlowTableBody"></tbody>
      </table>
      <p class="hint" id="businessLiveFlowHint"></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>AI 持久化历史</h2>
        <div class="filters">
          <button id="loadAiPersistenceHistoryBtn">刷新历史</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>类型</th>
            <th>时间</th>
            <th>执行人</th>
            <th>场景</th>
            <th>结果</th>
            <th>模式</th>
            <th>报告</th>
            <th>信息</th>
          </tr>
        </thead>
        <tbody id="aiPersistenceHistoryTableBody"></tbody>
      </table>
      <p class="hint" id="aiPersistenceHistoryHint"></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>AI 历史详情</h2>
        <div class="filters">
          <span class="hint">点击上方历史表的“查看详情”加载归档内容</span>
        </div>
      </div>
      <table>
        <tbody id="aiPersistenceHistoryDetailMetaBody"></tbody>
      </table>
      <pre id="aiPersistenceHistoryDetailContent">暂无详情</pre>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>设备分页列表</h2>
        <div class="filters">
          <input id="deviceHomeId" placeholder="homeId（可选）" />
          <input id="deviceProductKey" placeholder="productKey（可选）" />
          <select id="deviceStatus">
            <option value="">全部状态</option>
            <option value="0">未激活</option>
            <option value="1">在线</option>
            <option value="2">离线</option>
          </select>
          <input id="devicePageNo" type="number" min="1" value="1" />
          <input id="devicePageSize" type="number" min="1" max="200" value="20" />
          <button id="loadDevicesBtn">查询设备</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>设备ID</th>
            <th>名称</th>
            <th>homeId</th>
            <th>productKey</th>
            <th>状态</th>
            <th>固件版本</th>
          </tr>
        </thead>
        <tbody id="deviceTableBody"></tbody>
      </table>
      <p class="hint" id="devicePageHint"></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>OTA 任务分页列表</h2>
        <div class="filters">
          <input id="otaHomeId" placeholder="homeId（可选）" />
          <input id="otaProductKey" placeholder="productKey（可选）" />
          <select id="otaStatus">
            <option value="">全部状态</option>
            <option value="1">进行中</option>
            <option value="2">已完成</option>
          </select>
          <input id="otaPageNo" type="number" min="1" value="1" />
          <input id="otaPageSize" type="number" min="1" max="200" value="20" />
          <button id="loadOtaBtn">查询 OTA</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>任务ID</th>
            <th>homeId</th>
            <th>productKey</th>
            <th>目标版本</th>
            <th>状态</th>
            <th>成功/失败/总数</th>
          </tr>
        </thead>
        <tbody id="otaTableBody"></tbody>
      </table>
      <p class="hint" id="otaPageHint"></p>
    </section>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>

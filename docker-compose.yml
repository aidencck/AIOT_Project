version: '3.8'

networks:
  aiot-net:
    driver: bridge
    name: aiot-net

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  emqx-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  promtail-positions:

services:
  mysql:
    image: mysql:8.0
    container_name: aiot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: aiot_cloud
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    container_name: aiot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: aiot-nacos
    restart: unless-stopped
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - TZ=Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8848"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  emqx:
    image: emqx:5.3.0
    container_name: aiot-emqx
    restart: unless-stopped
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_API_USER:-admin}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_API_PASSWORD}
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  aiot-gateway:
    image: ghcr.io/aidencck/aiot-java/aiot-gateway:${IMAGE_TAG:-main}
    container_name: aiot-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - AIOT_JWT_SECRET=${AIOT_JWT_SECRET}
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aiot-home-service:
    image: ghcr.io/aidencck/aiot-java/aiot-home-service:${IMAGE_TAG:-main}
    container_name: aiot-home-service
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8083
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - MYSQL_HOST=aiot-mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=aiot_home
      - MYSQL_USER=root
      - MYSQL_PWD=${MYSQL_PASSWORD}
      - REDIS_HOST=aiot-redis
      - REDIS_PORT=6379
      - AIOT_INTERNAL_TOKEN=${AIOT_INTERNAL_TOKEN}
      - AIOT_JWT_SECRET=${AIOT_JWT_SECRET}
      - AIOT_DEVICE_SERVICE_URL=http://aiot-device-service:8081
      - AIOT_CROSS_SERVICE_TIMEOUT_MS=${AIOT_CROSS_SERVICE_TIMEOUT_MS:-2000}
      - AIOT_CROSS_SERVICE_MAX_RETRIES=${AIOT_CROSS_SERVICE_MAX_RETRIES:-1}
      - AIOT_CROSS_SERVICE_RETRY_BACKOFF_MS=${AIOT_CROSS_SERVICE_RETRY_BACKOFF_MS:-200}
      - AIOT_CROSS_SERVICE_CB_FAILURE_THRESHOLD=${AIOT_CROSS_SERVICE_CB_FAILURE_THRESHOLD:-3}
      - AIOT_CROSS_SERVICE_CB_OPEN_MS=${AIOT_CROSS_SERVICE_CB_OPEN_MS:-10000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aiot-rule-engine:
    image: ghcr.io/aidencck/aiot-java/aiot-rule-engine:${IMAGE_TAG:-main}
    container_name: aiot-rule-engine
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8084
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - REDIS_HOST=aiot-redis
      - SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED=false
      - SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aiot-shadow-service:
    image: ghcr.io/aidencck/aiot-java/aiot-shadow-service:${IMAGE_TAG:-main}
    container_name: aiot-shadow-service
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8087
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - REDIS_HOST=aiot-redis
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED=false
      - SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aiot-mqtt-adapter:
    image: ghcr.io/aidencck/aiot-java/aiot-mqtt-adapter:${IMAGE_TAG:-main}
    container_name: aiot-mqtt-adapter
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8085
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - AIOT_INTERNAL_TOKEN=${AIOT_INTERNAL_TOKEN}
      - AIOT_DATA_PARSER_BASE_URL=${AIOT_DATA_PARSER_BASE_URL:-http://aiot-data-parser:8086}
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED=false
      - SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      aiot-data-parser:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aiot-data-parser:
    image: ghcr.io/aidencck/aiot-java/aiot-data-parser:${IMAGE_TAG:-main}
    container_name: aiot-data-parser
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8086
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - REDIS_HOST=aiot-redis
      - AIOT_INTERNAL_TOKEN=${AIOT_INTERNAL_TOKEN}
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED=false
      - SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aiot-device-service:
    image: ghcr.io/aidencck/aiot-java/aiot-device-service:${IMAGE_TAG:-main}
    container_name: aiot-device-service
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8081
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - MYSQL_HOST=aiot-mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=aiot-redis
      - EMQX_HOST=aiot-emqx
      - EMQX_API_USER=${EMQX_API_USER}
      - EMQX_API_PASSWORD=${EMQX_API_PASSWORD}
      - AIOT_HOME_SERVICE_URL=http://aiot-home-service:8083
      - AIOT_RULE_SERVICE_URL=http://aiot-rule-engine:8084
      - AIOT_INTERNAL_TOKEN=${AIOT_INTERNAL_TOKEN}
      - AIOT_JWT_SECRET=${AIOT_JWT_SECRET}
      - AIOT_CROSS_SERVICE_TIMEOUT_MS=${AIOT_CROSS_SERVICE_TIMEOUT_MS:-2000}
      - AIOT_CROSS_SERVICE_MAX_RETRIES=${AIOT_CROSS_SERVICE_MAX_RETRIES:-1}
      - AIOT_CROSS_SERVICE_RETRY_BACKOFF_MS=${AIOT_CROSS_SERVICE_RETRY_BACKOFF_MS:-200}
      - AIOT_CROSS_SERVICE_CB_FAILURE_THRESHOLD=${AIOT_CROSS_SERVICE_CB_FAILURE_THRESHOLD:-3}
      - AIOT_CROSS_SERVICE_CB_OPEN_MS=${AIOT_CROSS_SERVICE_CB_OPEN_MS:-10000}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      aiot-home-service:
        condition: service_healthy
      aiot-rule-engine:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  aiot-auth-service:
    image: ghcr.io/aidencck/aiot-java/aiot-auth-service:${IMAGE_TAG:-main}
    container_name: aiot-auth-service
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8082
      - JAVA_OPTS=-Xms256m -Xmx256m
      - NACOS_ADDR=${NACOS_ADDR:-aiot-nacos:8848}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_DISCOVERY_GROUP=${NACOS_DISCOVERY_GROUP:-DEFAULT_GROUP}
      - NACOS_CONFIG_GROUP=${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-}
      - MYSQL_HOST=aiot-mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=aiot-redis
      - AIOT_DEVICE_SERVICE_URL=http://aiot-device-service:8081
      - AIOT_INTERNAL_TOKEN=${AIOT_INTERNAL_TOKEN}
      - AIOT_EMQX_WEBHOOK_SECRET=${AIOT_EMQX_WEBHOOK_SECRET}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      aiot-device-service:
        condition: service_healthy
    networks:
      - aiot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aiot-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - aiot-net
    depends_on:
      aiot-gateway:
        condition: service_started
      aiot-auth-service:
        condition: service_started
      aiot-device-service:
        condition: service_started
      aiot-home-service:
        condition: service_started
      aiot-rule-engine:
        condition: service_started
      aiot-shadow-service:
        condition: service_started
      aiot-mqtt-adapter:
        condition: service_started
      aiot-data-parser:
        condition: service_started

  loki:
    image: grafana/loki:3.1.1
    container_name: aiot-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - aiot-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: aiot-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions
    depends_on:
      loki:
        condition: service_started
    networks:
      - aiot-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: aiot-tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - aiot-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aiot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - aiot-net

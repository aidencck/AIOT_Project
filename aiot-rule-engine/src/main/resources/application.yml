spring.config.import: optional:classpath:application-common.yml

server:
  port: 8084

spring:
  application:
    name: aiot-rule-engine
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

# 云端 AI 诊断 LLM：OpenAI-compatible 协议，默认关闭；Docker 内由 AI_LLM_* 注入启用
ai:
  llm:
    enabled: ${AI_LLM_ENABLED:false}
    base-url: ${AI_LLM_BASE_URL:}
    api-key: ${AI_LLM_API_KEY:}
    provider: ${AI_LLM_PROVIDER:openai-compatible}
    model: ${AI_LLM_MODEL:qwen2.5:1.5b}
    timeout-ms: ${AI_LLM_TIMEOUT_MS:20000}
    temperature: ${AI_LLM_TEMPERATURE:0.2}
    num-predict: ${AI_LLM_NUM_PREDICT:512}
    num-ctx: ${AI_LLM_NUM_CTX:2048}

aiot:
  ai:
    eval:
      report-dir: ${AIOT_AI_EVAL_REPORT_DIR:training/data/reports}
    persistence:
      mysql:
        enabled: ${AIOT_AI_PERSISTENCE_MYSQL_ENABLED:false}
        read-mode: ${AIOT_AI_PERSISTENCE_READ_MODE:REDIS}
        cutover-guard-enabled: ${AIOT_AI_PERSISTENCE_CUTOVER_GUARD_ENABLED:true}
        allow-unsafe-mysql-read: ${AIOT_AI_PERSISTENCE_ALLOW_UNSAFE_MYSQL_READ:false}
        cutover-guard-cache-ttl-ms: ${AIOT_AI_PERSISTENCE_CUTOVER_GUARD_CACHE_TTL_MS:5000}
        backfill-manifest-path: ${AIOT_AI_PERSISTENCE_BACKFILL_MANIFEST_PATH:training/data/backfill/redis_to_mysql_manifest.json}
        consistency-report-path: ${AIOT_AI_PERSISTENCE_CONSISTENCY_REPORT_PATH:training/data/reports/persistence/offline_flap_consistency.json}
        constraints-report-path: ${AIOT_AI_PERSISTENCE_CONSTRAINTS_REPORT_PATH:training/data/reports/persistence/mysql_constraints_verification.json}
        migration-gate-report-path: ${AIOT_AI_PERSISTENCE_MIGRATION_GATE_REPORT_PATH:training/data/reports/persistence/offline_flap_migration_gate.json}
        url: ${AIOT_AI_PERSISTENCE_MYSQL_URL:}
        username: ${AIOT_AI_PERSISTENCE_MYSQL_USER:}
        password: ${AIOT_AI_PERSISTENCE_MYSQL_PASSWORD:}
        driver-class-name: ${AIOT_AI_PERSISTENCE_MYSQL_DRIVER:com.mysql.cj.jdbc.Driver}
        outbox:
          replay-enabled: ${AIOT_AI_PERSISTENCE_MYSQL_OUTBOX_REPLAY_ENABLED:true}
          fixed-delay-ms: ${AIOT_AI_PERSISTENCE_MYSQL_OUTBOX_DELAY_MS:30000}
          batch-size: ${AIOT_AI_PERSISTENCE_MYSQL_OUTBOX_BATCH_SIZE:32}
      control-plane-drain:
        max-batch-size: ${AIOT_AI_PERSISTENCE_CONTROL_PLANE_DRAIN_MAX_BATCH_SIZE:200}
        report-path: ${AIOT_AI_PERSISTENCE_CONTROL_PLANE_DRAIN_REPORT_PATH:training/data/reports/persistence/ai_control_plane_redis_drain.json}
        history-index-path: ${AIOT_AI_PERSISTENCE_CONTROL_PLANE_DRAIN_HISTORY_INDEX_PATH:training/data/reports/persistence/ai_control_plane_redis_drain_index.json}
        history-limit: ${AIOT_AI_PERSISTENCE_CONTROL_PLANE_DRAIN_HISTORY_LIMIT:20}
      business-live-flow:
        report-path: ${AIOT_AI_PERSISTENCE_BUSINESS_LIVE_FLOW_REPORT_PATH:training/data/reports/persistence/ai_business_live_flow.json}
        history-index-path: ${AIOT_AI_PERSISTENCE_BUSINESS_LIVE_FLOW_HISTORY_INDEX_PATH:training/data/reports/persistence/ai_business_live_flow_index.json}
    case-materialization:
      replay-enabled: ${AIOT_AI_CASE_MATERIALIZATION_REPLAY_ENABLED:true}
      fixed-delay-ms: ${AIOT_AI_CASE_MATERIALIZATION_DELAY_MS:30000}
      batch-size: ${AIOT_AI_CASE_MATERIALIZATION_BATCH_SIZE:16}
    diagnosis:
      # 后台 LLM 推理并发度；CPU 推理 + 内存受限环境下保持 1 防止 llama-server OOM
      llm-concurrency: ${AI_LLM_CONCURRENCY:1}
      # 回填队列容量；超出后丢弃 LLM 回填，保持兜底结果，防止无限积压
      llm-queue-capacity: ${AI_LLM_QUEUE_CAPACITY:64}
  events:
    device-status-stream-group: ${AIOT_RULE_EVENTS_DEVICE_STATUS_STREAM_GROUP:aiot-rule-engine-group}
  rule:
    execution:
      # 幂等 TTL 需覆盖 pending-reclaim 重投窗口：max-delivery-count(10) × min-idle-ms(60000ms) = 600s，
      # 故默认 1800s（30 分钟）留余量，避免消息重投后仍被旧幂等键拦截。
      idempotency-ttl-seconds: ${AIOT_RULE_EXEC_IDEMPOTENCY_TTL_SECONDS:1800}
    action:
      webhook:
        timeout-ms: ${AIOT_RULE_ACTION_WEBHOOK_TIMEOUT_MS:2000}
        # webhook 目标 host 白名单（逗号分隔，忽略大小写）；命中后跳过 SSRF 私网/环回拦截
        allowed-hosts: ${AIOT_RULE_ACTION_WEBHOOK_ALLOWED_HOSTS:}
  ops:
    sla-check:
      enabled: ${AIOT_OPS_SLA_CHECK_ENABLED:true}
      fixed-delay-ms: ${AIOT_OPS_SLA_CHECK_DELAY_MS:60000}

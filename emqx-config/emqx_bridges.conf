## EMQX 5.x 设备上下线事件 → 云端 Webhook（参考配置）
##
## 说明：
## - EMQX 5.x 的规则/桥接对象持久化在 Mnesia 中，不会从 emqx.conf 自动加载。
##   本文件作为声明式参考与变更基线，实际启用请通过 Dashboard（Integration → Webhook）
##   或 REST API（/api/v5/bridges、/api/v5/rules）应用。
## - 占位符 ${AUTH_WEBHOOK_URL} 在应用前替换为真实地址，
##   默认：http://aiot-auth-service:8082/api/v1/emqx/webhook
## - 内部网络信任（方案 B）：EMQX 出站携带静态 X-Internal-Token 头，
##   由 AUTH 内部 token（AIOT_INTERNAL_TOKEN，与 aiot-auth-service 的 aiot.internal.token 一致）注入，
##   具体值从环境变量读取，见 emqx-config/README.md。

## 目标端点契约（与 aiot-auth-service EmqxAuthController /api/v1/emqx/webhook 对齐）
##   Method:  POST
##   Header:  Content-Type: application/json
##            X-Internal-Token: <AIOT_INTERNAL_TOKEN>（静态头，auth-service 匹配则跳过 HMAC 校验）
##   Body:    {"action":"client.connected|client.disconnected","clientid":"...","username":"...","timestamp":<秒>}
##   action 取值：$events/client_connected -> client.connected
##                $events/client_disconnected -> client.disconnected

## ---------------------------------------------------------------------------
## 规则 SQL（可直接粘贴到 Dashboard / REST API）
## 注意：auth 侧 timestamp 单位为「秒」，EMQX 事件的 timestamp/connected_at 为毫秒，故 / 1000。
## ---------------------------------------------------------------------------

## 设备上线
rules.aiot_device_connected {
  sql = """
    SELECT
      event AS action,
      clientid,
      username,
      timestamp / 1000 AS timestamp
    FROM "$events/client_connected"
  """
  actions = ["webhook:aiot_device_status_webhook"]
}

## 设备下线
rules.aiot_device_disconnected {
  sql = """
    SELECT
      event AS action,
      clientid,
      username,
      timestamp / 1000 AS timestamp
    FROM "$events/client_disconnected"
  """
  actions = ["webhook:aiot_device_status_webhook"]
}

## ---------------------------------------------------------------------------
## Webhook 桥接（参考定义，实际经 REST API / Dashboard 创建）
## ---------------------------------------------------------------------------
bridges.webhook.aiot_device_status_webhook {
  enable = true
  url = "${AUTH_WEBHOOK_URL}"
  method = post
  headers = {
    "content-type" = "application/json"
    "x-internal-token" = "${AIOT_INTERNAL_TOKEN}"
  }
  ## 请求体模板：仅透出 auth 侧需要的四个字段
  body = """{"action":"${action}","clientid":"${clientid}","username":"${username}","timestamp":${timestamp}}"""
}

## 方案 B 已落地：EMQX 5.x 内置 SQL 无 HMAC 函数，改为在 Webhook 桥接中携带静态
## X-Internal-Token 头；aiot-auth-service 匹配 aiot.internal.token 后跳过 HMAC 签名校验。
## 仅当 X-Internal-Token 缺失或不匹配时，才回退到原 HMAC 校验（x-emqx-signature）。
